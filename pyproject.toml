[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-shiftrepair"
version = "0.1.0"
description = "A local, verified shift-repair workbench for Hermes Agent"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Whyme Labs"}]
dependencies = [
  "ortools>=9.15.6755,<9.16",
  "pydantic>=2.12,<3",
  "fastapi>=0.115,<1",
]

[project.optional-dependencies]
preview = ["uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.12,<1", "mypy>=1.15,<2", "uvicorn>=0.30,<1"]

[project.scripts]
shiftrepair = "shiftrepair.cli:main"

[tool.setuptools]
packages = ["shiftrepair", "shiftrepair._preview"]

[tool.setuptools.package-dir]
"shiftrepair._preview" = "preview"

[tool.setuptools.package-data]
"shiftrepair._preview" = ["index.html", "app.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["shiftrepair"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
explicit_package_bases = true
